<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alfie's Adventure — playable test</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box;touch-action:manipulation}
body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#294b5d,#101923 65%);color:#fff;display:flex;align-items:center;justify-content:center}
main{width:min(900px,100%);padding:12px;text-align:center}h1{font-size:clamp(22px,4vw,32px);margin:3px 0 4px;font-weight:900;letter-spacing:-.03em}
.subtitle{margin:0 0 10px;color:#b8cfdb;font-size:13px}.screen{border:5px solid #0d1b29;border-radius:15px;overflow:hidden;box-shadow:0 20px 80px #0008;background:#89d8eb;max-width:840px;margin:auto}canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;image-rendering:pixelated}
.controls{display:flex;justify-content:space-between;gap:16px;max-width:730px;margin:15px auto 8px;user-select:none;align-items:center}.directions{display:flex;gap:10px}
.btn{min-width:77px;min-height:62px;border:2px solid #5f7c96;border-bottom:6px solid #35506a;border-radius:17px;background:#26394b;color:white;font-size:26px;font-weight:900;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.btn:active,.btn.active{background:#4b7d96;transform:translateY(3px);border-bottom-width:3px}.jump{min-width:120px;background:#dba03e;color:#202631;border-color:#ffe1a0;border-bottom-color:#a66c1d;font-size:20px}
.info{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;font-size:13px;color:#c6d4df}button.small{font:inherit;color:white;padding:7px 14px;border:1px solid #718495;border-radius:10px;background:#243749}
@media(min-width:880px){.controls{display:none}}@media(max-width:500px){main{padding:5px}h1{font-size:23px}.screen{border-width:3px}.controls{margin-top:10px}.btn{min-height:66px;min-width:71px}}
</style></head><body><main>
<h1>🐾 Alfie's Adventure</h1><p class="subtitle">Prototype v0.1 — collect all seven bones, then find Alfie's doghouse!</p>
<div class="screen"><canvas id="game" width="640" height="480" aria-label="Alfie's Adventure playable game"></canvas></div>
<div class="controls"><div class="directions"><button class="btn" id="left" aria-label="Move left">◀</button><button class="btn" id="right" aria-label="Move right">▶</button></div><button class="btn jump" id="jump">JUMP ↑</button></div>
<div class="info"><span>Keyboard: ← → or A D • Space to jump</span><button class="small" id="restart">↻ Restart</button></div>
</main><script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const W=640,H=480,G=394,world=1320;
const platforms=[[180,326,130,16],[405,282,126,16],[675,323,128,16],[890,290,150,16]],puddles=[[340,382,77,12],[810,382,72,12]];
const treatment=[[116,355],[250,286],[465,244],[595,355],[740,284],[954,251],[1129,355]];
let g,held={left:false,right:false,jump:false},jumpNow=false,acc=0,last=performance.now();
function reset(){g={x:40,y:G-38,vx:0,vy:0,grounded:true,facing:1,collected:0,won:false,splashes:0,tick:0,camera:0,treats:treatment.map(([x,y])=>({x,y,found:false}))};}
reset();
function box(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h));}
function disk(x,y,r,color){ctx.beginPath();ctx.arc(Math.round(x),Math.round(y),r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function tri(a,b,c,d,e,f,color){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.lineTo(e,f);ctx.closePath();ctx.fillStyle=color;ctx.fill()}
function text(x,y,s,sz=17,col='white'){ctx.font=`900 ${sz}px system-ui,sans-serif`;ctx.fillStyle=col;ctx.textBaseline='top';ctx.fillText(s,x,y)}
function overlap(x,y,w,h,ox,oy,ow,oh){return x<ox+ow&&x+w>ox&&y<oy+oh&&y+h>oy}
function tick(){
 if(g.won){jumpNow=false;return}
 g.tick++;
 g.vx=held.right?3.7:held.left?-3.7:0;
 if(g.vx)g.facing=Math.sign(g.vx);
 if(jumpNow&&g.grounded){g.vy=-10.8;g.grounded=false}jumpNow=false;
 g.x=Math.max(0,Math.min(world-48,g.x+g.vx));const lastBottom=g.y+38;
 g.vy=Math.min(12,g.vy+.52);g.y+=g.vy;g.grounded=false;
 if(g.vy>=0){for(const [px,py,pw] of platforms){if(g.x+40>px&&g.x+7<px+pw&&lastBottom<=py+4&&g.y+38>=py){g.y=py-38;g.vy=0;g.grounded=true}}
 if(lastBottom<=G&&g.y+38>=G&&!g.grounded){g.y=G-38;g.vy=0;g.grounded=true}}
 for(const t of g.treats){if(!t.found&&overlap(g.x,g.y,45,38,t.x-10,t.y-10,20,20)){t.found=true;g.collected++}}
 puddles.forEach(([x,y,w,h],i)=>{if(g.y+38>=G-4&&overlap(g.x+7,g.y+27,30,10,x,y,w,h)){g.x=i===0?165:660;g.y=G-38;g.vy=0;g.grounded=true;g.splashes++}});
 if(g.x>=1195&&g.collected===7&&g.grounded)g.won=true;
 g.camera=Math.max(0,Math.min(world-W,g.x-235));
}
function drawDog(x,y){let flip=g.facing<0;ctx.save();ctx.translate(Math.round(x),Math.round(y));if(flip){ctx.translate(48,0);ctx.scale(-1,1)}
 box(-5,13,15,7,'#bf8153');tri(-6,12-(g.tick%14<7?3:0),5,11,2,22,'#bf8153');
 box(8,10,30,21,'#bf8153');box(12,14,12,15,'#e8c693');box(9,29,8,9,'#bf8153');box(29,29,8,9,'#bf8153');
 box(25,2,21,25,'#bf8153');box(25,4,7,23,'#5d453a');box(39,17,11,10,'#e8c693');box(42,17,5,5,'#262a2f');box(37,9,4,4,'#262a2f');box(18,10,7,8,'#5d453a');ctx.restore()}
function drawBone(x,y,bob){y+=bob;disk(x-6,y-4,5,'#ddb05d');disk(x-6,y+5,5,'#ddb05d');disk(x+13,y-4,5,'#ddb05d');disk(x+13,y+5,5,'#ddb05d');box(x-6,y-5,20,12,'#fff9da');disk(x-6,y-3,4,'#fff9da');disk(x-6,y+5,4,'#fff9da');disk(x+14,y-3,4,'#fff9da');disk(x+14,y+5,4,'#fff9da')}
function draw(){const c=g.camera;
 box(0,0,640,480,'#89d8eb');disk(555-c*.05,92,37,'#ffe077');
 for(let i=0;i<5;i++){let bx=i*210-c*.25;disk(bx+30,255,105,'#f9faee');box(bx-80,255,250,50,'#77c091')}
 box(0,304,640,100,'#77c091');for(let i=0;i<7;i++)disk(i*205-c*.37,320,96,'#65b28f');
 for(let i=0;i<11;i++){let x=70+i*135-c*.68;if(x<-60||x>700)continue;box(x+16,273,13,120,'#8b684e');disk(x+22,264,35,'#4c9b74');disk(x+2,281,26,'#4c9b74');disk(x+42,285,27,'#4c9b74')}
 box(0,G,640,86,'#a5734a');box(0,G,640,11,'#5eb767');box(0,G+11,640,5,'#3d8e5b');for(let i=0;i<18;i++)box(i*78-c,G+17,27,4,'#c7925f');
 for(const [x,y,w,h]of platforms){box(x-c,y,w,h,'#8b5840');box(x-c,y,w,5,'#5eb767');box(x-c+5,y+9,w-10,3,'#ce9c68')}
 for(const [x,y,w,h]of puddles){disk(x-c+12,y+7,12,'#48afd2');box(x-c+12,y-4,w-24,h+12,'#48afd2');disk(x-c+w-12,y+7,12,'#48afd2');box(x-c+12,y+1,w-30,3,'#b1e6f1')}
 let hx=1188-c;box(hx+4,316,89,78,'#bf5b56');tri(hx-7,323,hx+48,275,hx+104,323,'#814046');box(hx+31,345,32,49,'#463643');disk(hx+47,349,16,'#463643');text(hx+19,321,'HOME',13,'#fff');
 g.treats.forEach((t,i)=>{if(!t.found)drawBone(t.x-c,t.y,Math.floor(g.tick/15+i)%3-1)});
 drawDog(g.x-c,g.y);
 box(0,0,640,66,'#1e2b3d');text(18,13,"ALFIE'S ADVENTURE",25,'#fffdf9');text(454,19,`BONES  ${g.collected}/7`,17,'#f9c043');
 text(18,46,'D-PAD TO MOVE  •  2 TO JUMP  •  + RESTART  •  HOME EXIT',11,'#e7f0f4');
 if(g.won){box(75,145,490,170,'#1e2b3d');box(85,155,470,150,'#efc572');box(96,166,448,128,'#1e2b3d');text(150,184,'ALFIE DID IT! 🐾',38);text(179,243,'ALL 7 BONES FOUND',20,'#f9c043');text(183,275,'PRESS RESTART TO REPLAY',15)}
 else if(g.collected===7)text(215,85,'FIND THE DOGHOUSE!',20,'#1e2b3d');
 else if(g.tick<270)text(172,84,'COLLECT 7 BONES TO GET HOME',18,'#1e2b3d');
}
function loop(time){const dt=Math.min(50,time-last);last=time;acc+=dt;while(acc>=1000/60){tick();acc-=1000/60}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup',' ','a','d','w'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')held.left=true;if(k==='arrowright'||k==='d')held.right=true;if((k===' '||k==='arrowup'||k==='w')&&!held.jump){held.jump=true;jumpNow=true}if(k==='r')reset()});
document.addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')held.left=false;if(k==='arrowright'||k==='d')held.right=false;if([' ','arrowup','w'].includes(k))held.jump=false});
for(const key of ['left','right','jump']){const el=document.getElementById(key);function down(e){e.preventDefault();el.classList.add('active');if(key==='jump'){if(!held.jump)jumpNow=true;held.jump=true}else held[key]=true;el.setPointerCapture?.(e.pointerId)}function up(e){e.preventDefault();el.classList.remove('active');held[key]=false}el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up)}
document.querySelector('#restart').onclick=reset;
</script></body></html>
